<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Easy Life Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f172a;
  --bg-card: #1e293b;
  --bg-hover: #334155;
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --primary: #3b82f6;
  --primary-dark: #2563eb;
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;
  --border: #334155;
  --radius: 12px;
  --shadow: 0 4px 6px -1px rgba(0,0,0,0.3), 0 2px 4px -1px rgba(0,0,0,0.2);
}
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
body { background:var(--bg); color:var(--text); min-height:100vh; padding-bottom:80px; }

.header { background:var(--bg-card); padding:16px 20px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; box-shadow:var(--shadow); }
.header h1 { font-size:20px; font-weight:700; }
.header .badge { background:var(--primary); color:#fff; padding:4px 12px; border-radius:20px; font-size:12px; font-weight:600; }

.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:16px 20px; }
.stat-card { background:var(--bg-card); border-radius:var(--radius); padding:16px; text-align:center; border:1px solid var(--border); }
.stat-card .number { font-size:28px; font-weight:700; color:var(--primary); }
.stat-card .label { font-size:12px; color:var(--text-muted); margin-top:4px; }

.toolbar { padding:0 20px 16px; display:flex; gap:10px; flex-wrap:wrap; }
.toolbar input, .toolbar select {
  background:var(--bg-card); border:1px solid var(--border); color:var(--text);
  padding:12px 16px; border-radius:var(--radius); font-size:14px; flex:1; min-width:140px;
}
.toolbar input:focus, .toolbar select:focus { outline:none; border-color:var(--primary); }
.btn { padding:12px 20px; border-radius:var(--radius); border:none; font-size:14px; font-weight:600; cursor:pointer; transition:all 0.2s; }
.btn-primary { background:var(--primary); color:#fff; }
.btn-primary:hover { background:var(--primary-dark); }
.btn-danger { background:var(--danger); color:#fff; }
.btn-success { background:var(--success); color:#fff; }
.btn-sm { padding:8px 14px; font-size:12px; }

.product-list { padding:0 20px; }
.product-card {
  background:var(--bg-card); border-radius:var(--radius); border:1px solid var(--border);
  margin-bottom:12px; overflow:hidden; transition:all 0.2s;
}
.product-card:hover { border-color:var(--primary); }
.product-main { display:flex; align-items:center; gap:14px; padding:14px; }
.product-img { width:60px; height:60px; border-radius:8px; object-fit:cover; flex-shrink:0; }
.product-info { flex:1; min-width:0; }
.product-name { font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.product-meta { font-size:12px; color:var(--text-muted); margin-top:4px; }
.product-price { font-size:16px; font-weight:700; color:var(--success); }
.product-actions { display:flex; gap:8px; }

.status { display:inline-block; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:600; }
.status-active { background:rgba(34,197,94,0.15); color:var(--success); }
.status-hidden { background:rgba(239,68,68,0.15); color:var(--danger); }

.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:200; display:none; align-items:center; justify-content:center; padding:20px; }
.modal-overlay.active { display:flex; }
.modal { background:var(--bg-card); border-radius:var(--radius); width:100%; max-width:500px; max-height:90vh; overflow-y:auto; border:1px solid var(--border); }
.modal-header { padding:20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.modal-header h2 { font-size:18px; }
.modal-close { background:none; border:none; color:var(--text-muted); font-size:24px; cursor:pointer; }
.modal-body { padding:20px; }
.form-group { margin-bottom:16px; }
.form-group label { display:block; font-size:13px; color:var(--text-muted); margin-bottom:6px; font-weight:500; }
.form-group input, .form-group select, .form-group textarea {
  width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
  padding:12px; border-radius:8px; font-size:14px;
}
.form-group textarea { min-height:80px; resize:vertical; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline:none; border-color:var(--primary); }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

.faq-item { background:var(--bg); border-radius:8px; padding:12px; margin-bottom:10px; border:1px solid var(--border); }
.faq-item input { width:100%; background:transparent; border:none; border-bottom:1px solid var(--border); color:var(--text); padding:8px 0; margin-bottom:8px; font-size:13px; }
.faq-item input:focus { outline:none; border-bottom-color:var(--primary); }
.faq-remove { color:var(--danger); font-size:12px; cursor:pointer; background:none; border:none; }

.toast-container { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:300; display:flex; flex-direction:column; gap:8px; }
.toast { background:var(--bg-card); color:var(--text); padding:14px 24px; border-radius:var(--radius); font-size:14px; font-weight:500; box-shadow:var(--shadow); border:1px solid var(--border); display:flex; align-items:center; gap:10px; animation:slideUp 0.3s ease; }
.toast.success { border-left:4px solid var(--success); }
.toast.error { border-left:4px solid var(--danger); }
@keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

.loading { text-align:center; padding:60px 20px; color:var(--text-muted); }
.spinner { width:40px; height:40px; border:3px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 16px; }
@keyframes spin { to { transform:rotate(360deg); } }

.bottom-nav { position:fixed; bottom:0; left:0; right:0; background:var(--bg-card); border-top:1px solid var(--border); display:flex; justify-content:space-around; padding:8px 0; z-index:100; }
.nav-item { background:none; border:none; color:var(--text-muted); font-size:11px; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 16px; cursor:pointer; }
.nav-item.active { color:var(--primary); }
.nav-item svg { width:22px; height:22px; }

.order-card { background:var(--bg-card); border-radius:var(--radius); border:1px solid var(--border); margin-bottom:12px; padding:16px; }
.order-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.order-id { font-size:12px; color:var(--text-muted); }
.order-status { padding:4px 10px; border-radius:20px; font-size:11px; font-weight:600; }
.order-status.new { background:rgba(59,130,246,0.15); color:var(--primary); }
.order-status.processing { background:rgba(245,158,11,0.15); color:var(--warning); }
.order-status.delivered { background:rgba(34,197,94,0.15); color:var(--success); }
.order-details { font-size:13px; color:var(--text-muted); line-height:1.8; }
.order-details strong { color:var(--text); }

.lock-screen { position:fixed; inset:0; background:var(--bg); z-index:500; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:20px; }
.lock-screen input { background:var(--bg-card); border:1px solid var(--border); color:var(--text); padding:16px 20px; border-radius:var(--radius); font-size:16px; width:280px; text-align:center; }
.lock-screen .btn { width:280px; }

.empty { text-align:center; padding:60px 20px; color:var(--text-muted); }
.empty svg { width:64px; height:64px; margin-bottom:16px; opacity:0.3; }

@media(max-width:400px) {
  .stats { grid-template-columns:repeat(3,1fr); gap:8px; padding:12px; }
  .stat-card { padding:12px 8px; }
  .stat-card .number { font-size:22px; }
  .product-main { padding:12px; gap:10px; }
  .product-img { width:50px; height:50px; }
  .toolbar { padding:0 12px 12px; }
  .product-list { padding:0 12px; }
}
</style>
</head>
<body>

<div class="lock-screen" id="lockScreen">
  <h2>🔒 Admin Panel</h2>
  <input type="password" id="adminPass" placeholder="Enter password" onkeydown="if(event.key==='Enter')unlock()">
  <button class="btn btn-primary" onclick="unlock()">Unlock</button>
</div>

<div class="header" id="header" style="display:none;">
  <h1>Easy Life Admin</h1>
  <span class="badge" id="totalBadge">0 products</span>
</div>

<div class="stats" id="stats" style="display:none;">
  <div class="stat-card"><div class="number" id="statTotal">0</div><div class="label">Total</div></div>
  <div class="stat-card"><div class="number" id="statActive">0</div><div class="label">Active</div></div>
  <div class="stat-card"><div class="number" id="statHidden">0</div><div class="label">Hidden</div></div>
</div>

<div class="toolbar" id="toolbar" style="display:none;">
  <input type="text" id="searchInput" placeholder="🔍 Search products..." oninput="filterProducts()">
  <select id="catFilter" onchange="filterProducts()">
    <option value="">All Categories</option>
    <option>Defender Products</option>
    <option>Easy Cooking</option>
    <option>Easy Electricity</option>
    <option>Easy Home Set Up</option>
    <option>Easy Cleaning</option>
    <option>Network Solver</option>
    <option>Cooling & Climate Solver</option>
    <option>Smart Life Product</option>
  </select>
  <button class="btn btn-primary" onclick="openAddModal()">+ Add Product</button>
</div>

<div class="product-list" id="productList" style="display:none;"></div>
<div class="product-list" id="ordersList" style="display:none;"></div>

<div class="toast-container" id="toastContainer"></div>

<div class="modal-overlay" id="productModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Edit Product</h2>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editId">
      <div class="form-row">
        <div class="form-group"><label>Product Name</label><input type="text" id="editName" placeholder="Full product name"></div>
        <div class="form-group"><label>Short Name</label><input type="text" id="editShortName" placeholder="Short display name"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Price (৳)</label><input type="number" id="editPrice" placeholder="490"></div>
        <div class="form-group"><label>Old Price (৳)</label><input type="number" id="editOldPrice" placeholder="890"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Discount</label><input type="text" id="editDiscount" placeholder="45% OFF"></div>
        <div class="form-group"><label>Category</label>
          <select id="editCategory">
            <option>Defender Products</option><option>Easy Cooking</option><option>Easy Electricity</option>
            <option>Easy Home Set Up</option><option>Easy Cleaning</option><option>Network Solver</option>
            <option>Cooling & Climate Solver</option><option>Smart Life Product</option>
          </select>
        </div>
      </div>
      <div class="form-group"><label>Main Image URL</label><input type="text" id="editImage" placeholder="https://..."></div>
      <div class="form-group"><label>Gallery Images (one per line)</label><textarea id="editImages" rows="3" placeholder="https://...&#10;https://..."></textarea></div>
      <div class="form-group"><label>Description (HTML allowed)</label><textarea id="editDesc" rows="4" placeholder="<h2>Title</h2><p>Description...</p>"></textarea></div>
      <div class="form-group">
        <label>FAQ Questions & Answers</label>
        <div id="faqContainer"></div>
        <button class="btn btn-sm btn-primary" onclick="addFaqField()" style="margin-top:8px;">+ Add FAQ</button>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="editActive"><option value="Y">Active (Visible on site)</option><option value="N">Hidden (Not visible)</option></select>
      </div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="btn btn-success" onclick="saveProduct()" style="flex:1;">💾 Save</button>
        <button class="btn btn-danger" id="deleteBtn" onclick="deleteProduct()" style="display:none;">🗑 Delete</button>
      </div>
    </div>
  </div>
</div>

<div class="bottom-nav" id="bottomNav" style="display:none;">
  <button class="nav-item active" onclick="switchTab('products')" id="navProducts">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>Products
  </button>
  <button class="nav-item" onclick="switchTab('orders')" id="navOrders">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>Orders
  </button>
</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbySaYzWTSpmcBb3Nas8VX90EjM9CeLfuF5LUw576e5tPTTOT9p7QwaJ3VIPfXbGdwqNow/exec";

let allProducts = [];
let allOrders = [];
let currentTab = 'products';
let editingId = null;

function unlock() {
  const pass = document.getElementById('adminPass').value;
  if (pass === 'easy123') {
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('header').style.display = 'flex';
    document.getElementById('stats').style.display = 'grid';
    document.getElementById('toolbar').style.display = 'flex';
    document.getElementById('productList').style.display = 'block';
    document.getElementById('bottomNav').style.display = 'flex';
    loadProducts();
  } else {
    showToast('Wrong password!', 'error');
  }
}

async function apiGet(action) {
  try {
    const res = await fetch(APPS_SCRIPT_URL + '?action=' + action);
    return await res.json();
  } catch(e) {
    showToast('Network error: ' + e.message, 'error');
    return {success:false};
  }
}

async function apiPost(action, data) {
  try {
    const res = await fetch(APPS_SCRIPT_URL + '?action=' + action, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(data)
    });
    return await res.json();
  } catch(e) {
    showToast('Network error: ' + e.message, 'error');
    return {success:false};
  }
}

async function loadProducts() {
  document.getElementById('productList').innerHTML = '<div class="loading"><div class="spinner"></div>Loading products...</div>';
  const data = await apiGet('getProducts');
  if (data.success) {
    allProducts = data.products || [];
    updateStats();
    renderProducts();
  } else {
    document.getElementById('productList').innerHTML = '<div class="empty">Failed to load products</div>';
  }
}

async function loadOrders() {
  document.getElementById('ordersList').innerHTML = '<div class="loading"><div class="spinner"></div>Loading orders...</div>';
  const data = await apiGet('getOrders');
  if (data.success) {
    allOrders = data.orders || [];
    renderOrders();
  } else {
    document.getElementById('ordersList').innerHTML = '<div class="empty">Failed to load orders</div>';
  }
}

function updateStats() {
  const total = allProducts.length;
  const active = allProducts.filter(p => p.active === 'Y' || !p.active).length;
  const hidden = allProducts.filter(p => p.active === 'N').length;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statActive').textContent = active;
  document.getElementById('statHidden').textContent = hidden;
  document.getElementById('totalBadge').textContent = total + ' products';
}

function renderProducts() {
  const list = document.getElementById('productList');
  const search = document.getElementById('searchInput').value.toLowerCase();
  const cat = document.getElementById('catFilter').value;
  
  let filtered = allProducts.filter(p => {
    const matchSearch = !search || (p.name && p.name.toLowerCase().includes(search)) || (p.short_name && p.short_name.toLowerCase().includes(search));
    const matchCat = !cat || p.category === cat;
    return matchSearch && matchCat;
  });
  
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg><div>No products found</div></div>';
    return;
  }
  
  list.innerHTML = filtered.map(p => `
    <div class="product-card">
      <div class="product-main">
        <img src="${p.image || 'https://via.placeholder.com/60'}" class="product-img" onerror="this.src='https://via.placeholder.com/60'">
        <div class="product-info">
          <div class="product-name">${p.name || 'Untitled'}</div>
          <div class="product-meta">
            ${p.category || 'No category'} • 
            <span class="status ${(p.active === 'Y' || !p.active) ? 'status-active' : 'status-hidden'}">
              ${(p.active === 'Y' || !p.active) ? 'Active' : 'Hidden'}
            </span>
          </div>
        </div>
        <div style="text-align:right;">
          <div class="product-price">৳${p.price || 0}</div>
          <div class="product-actions" style="margin-top:8px;">
            <button class="btn btn-sm btn-primary" onclick='openEditModal(${JSON.stringify(p).replace(/'/g, "\\'")})'>Edit</button>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

function filterProducts() { renderProducts(); }

function renderOrders() {
  const list = document.getElementById('ordersList');
  if (allOrders.length === 0) {
    list.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg><div>No orders yet</div></div>';
    return;
  }
  
  list.innerHTML = allOrders.slice().reverse().map(o => `
    <div class="order-card">
      <div class="order-header">
        <span class="order-id">#${o.order_id || 'N/A'}</span>
        <span class="order-status ${(o.status || 'new').toLowerCase()}">${o.status || 'New'}</span>
      </div>
      <div class="order-details">
        <div><strong>${o.name || 'No name'}</strong> • ${o.phone || 'No phone'}</div>
        <div>${o.product_name || 'No product'} × ${o.quantity || 1}</div>
        <div>Total: <strong>৳${o.total_price || 0}</strong></div>
        <div>${o.address || 'No address'}</div>
        <div style="margin-top:6px; font-size:11px; color:#64748b;">${o.timestamp || ''}</div>
      </div>
    </div>
  `).join('');
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('navProducts').classList.toggle('active', tab === 'products');
  document.getElementById('navOrders').classList.toggle('active', tab === 'orders');
  
  if (tab === 'products') {
    document.getElementById('stats').style.display = 'grid';
    document.getElementById('toolbar').style.display = 'flex';
    document.getElementById('productList').style.display = 'block';
    document.getElementById('ordersList').style.display = 'none';
    loadProducts();
  } else {
    document.getElementById('stats').style.display = 'none';
    document.getElementById('toolbar').style.display = 'none';
    document.getElementById('productList').style.display = 'none';
    document.getElementById('ordersList').style.display = 'block';
    loadOrders();
  }
}

function openAddModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Add Product';
  document.getElementById('editId').value = '';
  document.getElementById('editName').value = '';
  document.getElementById('editShortName').value = '';
  document.getElementById('editPrice').value = '';
  document.getElementById('editOldPrice').value = '';
  document.getElementById('editDiscount').value = '';
  document.getElementById('editImage').value = '';
  document.getElementById('editImages').value = '';
  document.getElementById('editDesc').value = '';
  document.getElementById('editCategory').value = 'Defender Products';
  document.getElementById('editActive').value = 'Y';
  document.getElementById('faqContainer').innerHTML = '';
  document.getElementById('deleteBtn').style.display = 'none';
  document.getElementById('productModal').classList.add('active');
}

function openEditModal(product) {
  editingId = product.id;
  document.getElementById('modalTitle').textContent = 'Edit Product';
  document.getElementById('editId').value = product.id || '';
  document.getElementById('editName').value = product.name || '';
  document.getElementById('editShortName').value = product.short_name || '';
  document.getElementById('editPrice').value = product.price || '';
  document.getElementById('editOldPrice').value = product.old_price || '';
  document.getElementById('editDiscount').value = product.discount || '';
  document.getElementById('editImage').value = product.image || '';
  document.getElementById('editImages').value = (product.images || []).join('\n');
  document.getElementById('editDesc').value = product.desc || '';
  document.getElementById('editCategory').value = product.category || 'Defender Products';
  document.getElementById('editActive').value = product.active || 'Y';
  
  const faqContainer = document.getElementById('faqContainer');
  faqContainer.innerHTML = '';
  if (product.faq && product.faq.length) {
    product.faq.forEach(f => addFaqField(f.q, f.a));
  }
  
  document.getElementById('deleteBtn').style.display = 'block';
  document.getElementById('productModal').classList.add('active');
}

function closeModal() { document.getElementById('productModal').classList.remove('active'); }

function addFaqField(q, a) {
  const container = document.getElementById('faqContainer');
  const div = document.createElement('div');
  div.className = 'faq-item';
  div.innerHTML = `
    <input type="text" placeholder="Question" class="faq-q" value="${q || ''}">
    <input type="text" placeholder="Answer" class="faq-a" value="${a || ''}">
    <button class="faq-remove" onclick="this.parentElement.remove()">Remove</button>
  `;
  container.appendChild(div);
}

async function saveProduct() {
  const faqItems = [];
  document.querySelectorAll('.faq-item').forEach(item => {
    const q = item.querySelector('.faq-q').value;
    const a = item.querySelector('.faq-a').value;
    if (q && a) faqItems.push({q, a});
  });
  
  const imagesStr = document.getElementById('editImages').value;
  const images = imagesStr.split('\n').map(s => s.trim()).filter(s => s);
  
  const product = {
    id: editingId || (allProducts.length ? Math.max(...allProducts.map(p => parseInt(p.id)||0)) + 1 : 1),
    name: document.getElementById('editName').value,
    short_name: document.getElementById('editShortName').value,
    price: parseInt(document.getElementById('editPrice').value) || 0,
    old_price: parseInt(document.getElementById('editOldPrice').value) || 0,
    discount: document.getElementById('editDiscount').value,
    image: document.getElementById('editImage').value,
    images: images,
    category: document.getElementById('editCategory').value,
    desc: document.getElementById('editDesc').value,
    faq: faqItems,
    active: document.getElementById('editActive').value
  };
  
  if (!product.name || !product.price) {
    showToast('Name and price are required!', 'error');
    return;
  }
  
  const action = editingId ? 'updateProduct' : 'addProduct';
  const res = await apiPost(action, product);
  
  if (res.success) {
    showToast(editingId ? 'Product updated!' : 'Product added!', 'success');
    closeModal();
    loadProducts();
  } else {
    showToast(res.error || 'Failed to save', 'error');
  }
}

async function deleteProduct() {
  if (!confirm('Are you sure you want to delete this product?')) return;
  
  const res = await apiPost('deleteProduct', {id: editingId});
  if (res.success) {
    showToast('Product deleted!', 'success');
    closeModal();
    loadProducts();
  } else {
    showToast(res.error || 'Failed to delete', 'error');
  }
}

function showToast(message, type) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

document.getElementById('productModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
</script>
</body>
</html>
